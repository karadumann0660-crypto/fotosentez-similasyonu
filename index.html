<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fotosentez Simülasyonu</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #050b14; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-panel {
            position: absolute; top: 15px; left: 15px; width: 280px;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #4ade80; text-transform: uppercase; letter-spacing: 1px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #cbd5e1; }
        input[type=range] { width: 100%; cursor: pointer; }
        .metric { display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 8px; font-weight: bold; }
        .metric-val { color: #38bdf8; }
        #instructions {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; color: #94a3b8;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-panel">
        <h2>3D Fotosentez</h2>
        <div class="control-group">
            <label>Işık Şiddeti: <span id="light-val">50</span>%</label>
            <input type="range" id="lightSlider" min="0" max="100" value="50">
        </div>
        <div class="control-group">
            <label>Sıcaklık: <span id="temp-val">25</span>°C</label>
            <input type="range" id="tempSlider" min="0" max="50" value="25">
        </div>
        <hr style="border-color: rgba(255,255,255,0.1);">
        <div class="metric"><span>Fotosentez Hızı:</span> <span id="rateVal" class="metric-val">%0</span></div>
        <div class="metric"><span>Üretilen Glikoz:</span> <span id="glucoseVal" class="metric-val">0 mg</span></div>
        <div class="metric"><span>Açığa Çıkan O₂:</span> <span id="o2Val" class="metric-val">0 ml</span></div>
    </div>
    <div id="instructions">Fare / Dokunmatik ekran ile 3D sahnede 360° dönebilirsiniz.</div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050b14, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(5, 10, 5);
        scene.add(sunLight);

        const chloroplastGroup = new THREE.Group();
        const outerGeo = new THREE.SphereGeometry(3, 32, 16);
        outerGeo.scale(1.5, 0.6, 1);
        const outerMat = new THREE.MeshPhongMaterial({ color: 0x15803d, transparent: true, opacity: 0.45 });
        const outerMesh = new THREE.Mesh(outerGeo, outerMat);
        chloroplastGroup.add(outerMesh);

        function createGranum(x, z) {
            const granum = new THREE.Group();
            for(let i = 0; i < 4; i++) {
                const discGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.15, 16);
                const discMat = new THREE.MeshPhongMaterial({ color: 0x22c55e });
                const disc = new THREE.Mesh(discGeo, discMat);
                disc.position.set(x, (i * 0.2) - 0.3, z);
                granum.add(disc);
            }
            return granum;
        }

        chloroplastGroup.add(createGranum(-1.5, 0));
        chloroplastGroup.add(createGranum(0, 0));
        chloroplastGroup.add(createGranum(1.5, 0));
        chloroplastGroup.add(createGranum(-0.7, -0.8));
        chloroplastGroup.add(createGranum(0.7, 0.8));
        scene.add(chloroplastGroup);

        const particleGeo = new THREE.SphereGeometry(0.09, 8, 8);
        const particleMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        const particles = [];

        for(let i=0; i<35; i++) {
            const p = new THREE.Mesh(particleGeo, particleMat);
            p.position.set((Math.random()-0.5)*4, (Math.random()-0.5)*2, (Math.random()-0.5)*3);
            p.userData = { velocity: new THREE.Vector3((Math.random()-0.5)*0.02, Math.random()*0.02 + 0.01, (Math.random()-0.5)*0.02) };
            particles.push(p);
            scene.add(p);
        }

        let lightVal = 50, tempVal = 25, glucose = 0, o2 = 0;
        document.getElementById('lightSlider').addEventListener('input', (e) => {
            lightVal = e.target.value;
            document.getElementById('light-val').innerText = lightVal;
            sunLight.intensity = lightVal / 50;
        });
        document.getElementById('tempSlider').addEventListener('input', (e) => {
            tempVal = e.target.value;
            document.getElementById('temp-val').innerText = tempVal;
        });

        function animate() {
            requestAnimationFrame(animate);
            chloroplastGroup.rotation.y += 0.003;

            let rate = (lightVal / 100) * (1 - Math.abs(tempVal - 25) / 25) * 100;
            rate = Math.max(0, rate);
            document.getElementById('rateVal').innerText = '%' + Math.round(rate);

            if(rate > 0) {
                glucose += rate * 0.001;
                o2 += rate * 0.002;
                document.getElementById('glucoseVal').innerText = glucose.toFixed(1) + ' mg';
                document.getElementById('o2Val').innerText = o2.toFixed(1) + ' ml';
            }

            particles.forEach(p => {
                p.position.addScaledVector(p.userData.velocity, rate / 50);
                if(p.position.y > 4) p.position.y = -1;
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
